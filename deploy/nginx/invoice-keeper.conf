# Invoice Keeper за nginx: TLS терминируется здесь, приложение слушает 127.0.0.1:8080.
#
# Подставьте свой домен и пути к сертификатам, затем:
#   sudo cp deploy/nginx/invoice-keeper.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/invoice-keeper.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат Let's Encrypt: sudo certbot --nginx -d invoice.example.com

server {
    listen 80;
    listen [::]:80;
    server_name invoice.example.com;

    # Проверка доменного имени Let's Encrypt должна работать и до редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name invoice.example.com;

    ssl_certificate     /etc/letsencrypt/live/invoice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invoice.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Панель ходит по HTTPS, cookie и запросы — только туда.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Ответы напоминаний и страниц небольшие; запас — на вложения будущих форм.
    client_max_body_size 1m;

    # Статика встроена в бинарник и меняется только с релизом — кэшируем её.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        # Приложение читает реальный адрес клиента из X-Forwarded-For
        # (fiber.Config.ProxyHeader), иначе rate-limit входа считает всех одним.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
